<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>LBE Drop</title>
<link rel="icon" href="marka/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="marka/favicon.ico">
<link rel="apple-touch-icon" href="marka/apple-touch-icon.png">
<link rel="stylesheet" href="marka/tokens/tokens.css">
<link rel="stylesheet" href="marka/tokens/bilesenler.css">
<link rel="stylesheet" href="panel.css">
<script>
  // Koyu görünüm cihaz ayarını izler; renkler marka/tokens/tokens.css içindedir.
  (function () {
    var m = window.matchMedia("(prefers-color-scheme: dark)");
    var uygula = function () { document.documentElement.toggleAttribute("data-theme", false); if (m.matches) document.documentElement.setAttribute("data-theme", "dark"); };
    uygula(); m.addEventListener("change", uygula);
  })();
</script>
</head>
<body class="drop">
<div id="kok"><p class="yukleniyor">Yükleniyor…</p></div>
<dialog id="soru" class="kutu" aria-labelledby="soru-baslik">
  <h2 id="soru-baslik"></h2>
  <p class="yardim" id="soru-metin"></p>
  <div class="dugmeler"><button type="button" class="btn" id="soru-hayir">Vazgeç</button><button type="button" class="btn btn-red" id="soru-evet"></button></div>
</dialog>
<dialog id="onizleme" class="kutu genis" aria-labelledby="onizleme-baslik">
  <div class="baslik-satiri"><h2 id="onizleme-baslik"></h2><button type="button" class="btn btn-kucuk" id="onizleme-kapat">Kapat</button></div>
  <div id="onizleme-govde" class="izleyici-kutu"></div>
</dialog>
<noscript><p style="padding:24px">LBE Drop için JavaScript açık olmalı.</p></noscript>
<script src="ayar.js"></script>
<script src="app.js"></script>
</body>
</html>
